name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WordApp APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Verify Project Files
        run: |
          test -f package.json
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Clean Previous Build
        run: |
          cd android
          ./gradlew clean --no-daemon

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

      - name: Find Generated APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/release \
            -type f -name '*.apk' -print
          APK_PATH="$(find android/app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          cp "$APK_PATH" build-artifacts/WordApp-release.apk
          ls -lh build-artifacts/WordApp-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordApp-Android-APK
          path: build-artifacts/WordApp-release.apk
          retention-days: 30
          if-no-files-found: error
